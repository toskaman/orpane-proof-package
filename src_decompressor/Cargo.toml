[package]
name = "orpane-dec"
version = "1.2.3"
edition = "2021"
authors = ["toskaman"]
description = "Orpane Universal Standalone Decompressor and Verifier"

[dependencies]
brotli = "7.0"
bzip2-rs = "0.1.2"
lzma-rs = "0.3"
ruzstd = "0.7"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash32", "xxhash3_64"] }
blake3 = { version = "1.5", default-features = false }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
